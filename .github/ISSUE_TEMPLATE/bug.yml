name: Bug
description: Something in teazy-api doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. POST /api/v1/lessons with ...  2. ..."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Environment and device
      placeholder: "local / staging / production"
  - type: input
    id: request-id
    attributes:
      label: Request ID (from the error envelope or logs), if any
  - type: markdown
    attributes:
      value: "Never paste secrets, tokens or real student data."
